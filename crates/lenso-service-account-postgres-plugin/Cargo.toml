[package]
name = "lenso-service-account-postgres-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "PostgreSQL organization-scoped Service Account Plugin for Lenso."

[package.metadata.lenso]
plugin-id = "lenso.service-account"
root-slot = "service-accounts"

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
getrandom.workspace = true
lenso.workspace = true
lenso-auth-sdk.workspace = true
lenso-capability-access-control.workspace = true
lenso-capability-credential-issuer.workspace = true
lenso-capability-identity-directory.workspace = true
lenso-capability-organization-membership.workspace = true
lenso-capability-secrets.workspace = true
lenso-capability-service-account = { path = "../lenso-capability-service-account", version = "0.1.0" }
lenso-capability-service-account-auth = { path = "../lenso-capability-service-account-auth", version = "0.1.0" }
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures.workspace = true
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid.workspace = true

[lints]
workspace = true
