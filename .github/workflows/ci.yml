name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install exact contract projection checker
        run: cargo install --locked --version '=0.6.5' lenso-contract-codegen
      - name: Verify exact Capability projections
        run: |
          lenso-contract-codegen check crates/lenso-capability-service-account/capability.json \
            --rust crates/lenso-capability-service-account/src/generated.rs
          lenso-contract-codegen check crates/lenso-capability-service-account-auth/capability.json \
            --rust crates/lenso-capability-service-account-auth/src/generated.rs
      - name: Verify public packages
        run: ./scripts/check-public-packages.sh
      - run: ./scripts/check-repository-boundary.sh
      - name: PostgreSQL restart and concurrency acceptance
        env:
          LENSO_TEST_POSTGRES_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: >-
          cargo test --locked -p lenso-service-account-postgres-plugin
          restart_concurrency_and_secret_once_acceptance -- --ignored
